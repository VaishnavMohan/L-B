<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, height=630, initial-scale=1.0" />
  <title>OG Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #140A06;
      font-family: 'Cinzel', serif;
      color: #FFF6E5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-canvas {
      width: 1200px;
      height: 630px;
      position: relative;
      background: radial-gradient(ellipse at 50% 45%, #2A1308 0%, #170A04 55%, #0D0502 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      border: 12px solid #1C0E07;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.8);
    }

    /* Elegant Double Gold Border */
    .inner-border {
      position: absolute;
      inset: 24px;
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      pointer-events: none;
    }

    .inner-border-2 {
      position: absolute;
      inset: 32px;
      border: 1px dashed rgba(212, 175, 55, 0.25);
      border-radius: 4px;
      pointer-events: none;
    }

    /* Corner Florets */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      color: #D4AF37;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .c-tl { top: 18px; left: 18px; }
    .c-tr { top: 18px; right: 18px; }
    .c-bl { bottom: 18px; left: 18px; }
    .c-br { bottom: 18px; right: 18px; }

    /* Top Subtitle */
    .top-crest {
      font-size: 28px;
      margin-bottom: 6px;
      color: #D4AF37;
      filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.5));
    }

    .invitation-badge {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.38em;
      color: #D4AF37;
      text-transform: uppercase;
      margin-bottom: 12px;
      background: rgba(212, 175, 55, 0.1);
      padding: 4px 18px;
      border-radius: 9999px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .families-intro {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-style: italic;
      color: #E2CEB1;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }

    /* Couple Names */
    .couple-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 18px;
    }

    .name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 46px;
      font-weight: 800;
      color: #FFF3D6;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 14px rgba(212, 175, 55, 0.4);
      background: linear-gradient(135deg, #FFF8E7 0%, #F5D77F 50%, #C9972E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ampersand {
      font-family: 'Alex Brush', cursive;
      font-size: 58px;
      color: #E5BE5E;
      line-height: 1;
      padding: 0 4px;
      text-shadow: 0 2px 8px rgba(229, 190, 94, 0.5);
    }

    /* Date & Venue Box */
    .details-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .wedding-date {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      color: #FFDF85;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .muhurtham-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #D4AF37;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .divider-line {
      width: 140px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      margin: 6px 0;
    }

    .venue-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 23px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.05em;
    }

    .venue-location {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #C5A059;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card-canvas">
    <div class="inner-border"></div>
    <div class="inner-border-2"></div>
    
    <div class="corner c-tl">❦</div>
    <div class="corner c-tr">❦</div>
    <div class="corner c-bl">❦</div>
    <div class="corner c-br">❦</div>

    <div class="top-crest">✨ 💍 ✨</div>
    <div class="invitation-badge">Wedding Invitation</div>
    <div class="families-intro">Together with their families</div>

    <div class="couple-row">
      <div class="name">Dr. Keerthana</div>
      <div class="ampersand">&amp;</div>
      <div class="name">Dr. Sarath</div>
    </div>

    <div class="details-box">
      <div class="wedding-date">Sunday, 13 September 2026</div>
      <div class="muhurtham-tag">Muhurtham: 9:30 AM – 10:30 AM</div>
      <div class="divider-line"></div>
      <div class="venue-name">Puzhayoram Gardens Convention Centre</div>
      <div class="venue-location">Nadathara, Thrissur, Kerala</div>
    </div>
  </div>

</body>
</html>
